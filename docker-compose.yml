services:
  webapi:
    build:
      context: .
      dockerfile: Dockerfile
    command: /bin/bash -c "./docker-entrypoint.sh dotnet ConcernsCaseWork.dll"
    ports:
      - 80:8080/tcp
      - 443:8443/tcp
    environment:
      - ASPNETCORE_URLS=http://+:8080;https://+:8443
      - ASPNETCORE_HTTPS_PORT=443
    depends_on:
      db:
        condition: service_started
      sqlcmd:
        condition: service_completed_successfully
      redis:
        condition: service_started
      datamigration:
        condition: service_completed_successfully
    env_file:
       - .env.development.local
    volumes:
      - ${APPDATA}/ASP.NET/Https:/https:ro
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
    networks:
      - dev

  db:
    container_name: amsd-casework-sql-server
    image: mcr.microsoft.com/azure-sql-edge:latest@sha256:902628a8be89e35dfb7895ca31d602974c7bafde4d583a0d0873844feb1c42cf
    env_file: .env.database
    ports:
      - 14330:1433
    networks:
      - dev

  sqlcmd:
    image: mcr.microsoft.com/mssql-tools:latest@sha256:62556500522072535cb3df2bb5965333dded9be47000473e9e0f84118e248642
    env_file: .env.database
    command: /etc/docker-entrypoint.sh
    depends_on:
      db:
        condition: service_started
    stdin_open: true
    volumes:
      - ./script/sqlcmd-docker-entrypoint.sh:/etc/docker-entrypoint.sh
    networks:
      - dev

  datamigration:
    build:
      context: .
      dockerfile: Dockerfile
      target: efbuilder
    command:
      - /sql/migratedb
      - --connection
      - Server=db;Database=sip;User Id=sa;Password=Your_password123;TrustServerCertificate=True;Encrypt=False
    depends_on:
      db:
        condition: service_started
      sqlcmd:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - dev

  redis:
    image: redis:7@sha256:e9b2e45ecd47fbb69b877cf8d045d5cccaaaed52524b6e098b4abe8212994f73
    command: redis-server --requirepass password
    ports:
      - 6379:6379
    networks:
      - dev

networks:
  dev:
